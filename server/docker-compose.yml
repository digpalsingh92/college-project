version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # ── API Gateway ───────────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      PATIENT_SERVICE_URL: http://patient-service:3001
      ADMIN_SERVICE_URL: http://admin-service:3002
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      - patient-service
      - admin-service
      - doctor-service
      - ai-service
    networks:
      - app-network

  # ── Patient Service ───────────────────────────────────────────────────────────
  patient-service:
    build: ./services/patient-service
    container_name: patient-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/patientdb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 7d
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-sync-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ── Admin Service ─────────────────────────────────────────────────────────────
  admin-service:
    build: ./services/admin-service
    container_name: admin-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/admindb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 7d
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ── Doctor Service ────────────────────────────────────────────────────────────
  doctor-service:
    build: ./services/doctor-service
    container_name: doctor-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/doctordb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 7d
      PATIENT_SERVICE_URL: http://patient-service:3001
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-sync-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ── AI Service ────────────────────────────────────────────────────────────────
  ai-service:
    build: ./services/ai-service
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FLASK_ENV: production
      MODEL_PATH: app/models/saved
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
