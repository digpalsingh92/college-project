# Backend + frontend — Postgres runs separately on the host.
# Usage: docker compose up --build
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: ${BACKEND_PORT:-4000}
      # Must use host.docker.internal — localhost inside the container is not the host Postgres.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/collegeProject?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/server.js"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:4000
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: npm run start -- --hostname 0.0.0.0 --port 3000
